# Apply the exact source label only after approval for this full qualification run.
name: checks

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  checks:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.label.name == format('qualify-{0}', github.event.pull_request.head.sha)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [0, 1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 60
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 60
        with:
          python-version: '3.13'
      - name: Install pinned check tools
        timeout-minutes: 60
        run: python -m pip install -r requirements-dev.txt
      - name: Development dependency vulnerabilities
        timeout-minutes: 60
        run: python -m pip_audit --disable-pip --no-deps --strict -r requirements-dev.txt
      - name: Lint
        timeout-minutes: 60
        run: python -m ruff check buddha tests agents ci_test_shard.py
      - name: Formatting
        timeout-minutes: 60
        run: python -m ruff format --check buddha tests agents ci_test_shard.py
      - name: Types
        timeout-minutes: 60
        run: python -m mypy --strict buddha agents ci_test_shard.py
      - name: Code security
        timeout-minutes: 60
        run: python -m bandit -r buddha agents ci_test_shard.py
      - name: Runtime dependency vulnerabilities
        timeout-minutes: 60
        run: python -m pip_audit --no-deps -r requirements.txt
      - name: Compile
        timeout-minutes: 60
        run: python -m compileall -q buddha tests agents ci_test_shard.py
      - name: Unit and composed acceptance tests
        run: >-
          python -m ci_test_shard --count 5 --index ${{ matrix.shard }} --idle-seconds 3600
          --partition-seed 1688
          --isolate test_improver_study.FiniteImproverStudyTests.test_finite_fixed_operators_common_conditions_negative_slots_and_original_recovery
