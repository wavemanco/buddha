name: fast checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned check tools
        run: python -m pip install -r requirements-dev.txt
      - name: Development dependency vulnerabilities
        run: python -m pip_audit --disable-pip --no-deps --strict -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check buddha tests agents ci_test_shard.py
      - name: Formatting
        run: python -m ruff format --check buddha tests agents ci_test_shard.py
      - name: Types
        run: python -m mypy --strict buddha agents ci_test_shard.py
      - name: Code security
        run: python -m bandit -r buddha agents ci_test_shard.py
      - name: Runtime dependency vulnerabilities
        run: python -m pip_audit --no-deps -r requirements.txt
      - name: Compile
        run: python -m compileall -q buddha tests agents ci_test_shard.py
      - name: Fast contract tests (not full qualification)
        run: python -m ci_test_shard --suite contracts --count 1 --index 0 --idle-seconds 3600
