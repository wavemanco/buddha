name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned check tools
        run: python -m pip install -r requirements-dev.txt
      - name: Unit and composed acceptance tests
        run: python -m unittest discover -s tests -v --durations 30
      - name: Lint
        run: python -m ruff check buddha tests agents
      - name: Formatting
        run: python -m ruff format --check buddha tests agents
      - name: Types
        run: python -m mypy --strict buddha agents
      - name: Code security
        run: python -m bandit -r buddha agents
      - name: Runtime dependency vulnerabilities
        run: python -m pip_audit --no-deps -r requirements.txt
      - name: Compile
        run: python -m compileall -q buddha tests agents
